<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Убежище — База Игроков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            padding: 16px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.25);
        }

        .header h1 {
            font-size: 22px;
            color: #ffd700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 18px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-val {
            font-size: 18px;
            font-weight: bold;
            color: #00ffff;
        }

        .stat-lbl {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn {
            flex: 1;
            padding: 11px 14px;
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-gold {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 140, 0, 0.2));
            border-color: #ffd700;
            color: #ffd700;
        }

        .btn-cyan {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.15), rgba(0, 150, 255, 0.15));
            border-color: #00ffff;
            color: #00ffff;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border-left: 4px solid #00ffff;
        }

        .player-card.admin {
            border-left-color: #ffd700;
            background: rgba(30, 27, 75, 0.4);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .player-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-tag {
            font-size: 10px;
            background: #ffd700;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
            color: #cbd5e1;
        }

        .card-pass {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #ff77aa;
            font-size: 14px;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 12px;
        }

        .copy-btn:hover {
            color: #fff;
        }

        .stats-badge {
            font-size: 12px;
            color: #4ade80;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: #000;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 БАЗА ИГРОКОВ УБЕЖИЩА</h1>
        <p>Панель управления создателя игры</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-val" id="total-users">0</div>
            <div class="stat-lbl">Игроков</div>
        </div>
        <div class="stat-item">
            <div class="stat-val" id="total-wins">0</div>
            <div class="stat-lbl">Побед над Боссом</div>
        </div>
        <div class="stat-item">
            <div class="stat-val" id="top-player">—</div>
            <div class="stat-lbl">Лидер</div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-cyan" onclick="loadFirebaseData()">🔄 Обновить</button>
        <button class="btn btn-gold" onclick="sendRosterToTelegram()">📤 В Telegram</button>
    </div>

    <div id="cards-container" class="cards-list">
        <div class="loading">Загрузка данных из облака...</div>
    </div>

    <div id="toast" class="toast">✅ Сообщение отправлено!</div>

    <script>
        const FIREBASE_URL = 'https://silksong-shelter-default-rtdb.europe-west1.firebasedatabase.app';
        const TG_BOT_TOKEN = '8425811496:AAHkIJ_d1Ax4VyLvyKq4hWoWJfsC6SCYk-Q';
        const TG_ADMIN_CHAT_ID = '6465929018';

        let currentAccounts = {};

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        function showToast(text) {
            let t = document.getElementById('toast');
            if (t) {
                t.innerText = text;
                t.style.display = 'block';
                setTimeout(() => { t.style.display = 'none'; }, 2500);
            }
        }

        function copyPassword(pass) {
            navigator.clipboard.writeText(pass).then(() => {
                showToast("🔑 Пароль скопирован!");
            }).catch(() => {
                showToast("Пароль: " + pass);
            });
        }

        async function loadFirebaseData() {
            let container = document.getElementById('cards-container');
            container.innerHTML = '<div class="loading">Обновление...</div>';

            try {
                let res = await fetch(`${FIREBASE_URL}/accounts.json`);
                let data = await res.json();
                currentAccounts = data || {};
                renderCards(currentAccounts);
            } catch(e) {
                container.innerHTML = `<div class="loading" style="color: #ff6666;">Ошибка загрузки базы: ${e.message}</div>`;
            }
        }

        function renderCards(accounts) {
            let container = document.getElementById('cards-container');
            let list = Object.values(accounts);

            if (list.length === 0) {
                container.innerHTML = '<div class="loading">В базе пока нет игроков. Зарегистрируйтесь в игре!</div>';
                document.getElementById('total-users').innerText = '0';
                document.getElementById('total-wins').innerText = '0';
                document.getElementById('top-player').innerText = '—';
                return;
            }

            let totalWins = 0;
            list.forEach(a => {
                let st = a.stats || { soloNormalWins: 0, soloSecretWins: 0, duoNormalWins: 0, duoSecretWins: 0 };
                let w = (st.soloNormalWins || 0) + (st.soloSecretWins || 0) + (st.duoNormalWins || 0) + (st.duoSecretWins || 0);
                a._totalWins = w;
                totalWins += w;
            });

            list.sort((a, b) => b._totalWins - a._totalWins);

            document.getElementById('total-users').innerText = list.length;
            document.getElementById('total-wins').innerText = totalWins;
            document.getElementById('top-player').innerText = list[0].name || '—';

            container.innerHTML = list.map(acc => {
                let isOwner = (acc.name && acc.name.toLowerCase() === 'рыба');
                let regDate = acc.createdAt ? new Date(acc.createdAt).toLocaleDateString() : '—';
                let partners = acc.coopPartners && Object.keys(acc.coopPartners).length > 0 
                    ? Object.keys(acc.coopPartners).join(', ') 
                    : 'нет';
                return `
                    <div class="player-card ${isOwner ? 'admin' : ''}">
                        <div class="card-top">
                            <div class="player-name">
                                👤 ${acc.name}
                                ${isOwner ? '<span class="admin-tag">СОЗДАТЕЛЬ</span>' : ''}
                            </div>
                            <div class="stats-badge">🏆 ${acc._totalWins} побед</div>
                        </div>
                        <div class="card-row">
                            <span>Пароль:</span>
                            <span class="card-pass">
                                <b>${acc.password || '—'}</b>
                                <button class="copy-btn" onclick="copyPassword('${acc.password}')" title="Скопировать">📋</button>
                            </span>
                        </div>
                        <div class="card-row">
                            <span style="font-size: 11px; color: #64748b;">Дата регистрации:</span>
                            <span style="font-size: 11px; color: #64748b;">${regDate}</span>
                        </div>
                        <div class="card-row">
                            <span style="font-size: 11px; color: #00ddff;">Напарники:</span>
                            <span style="font-size: 11px; color: #aaddff;">${partners}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function sendRosterToTelegram() {
            let list = Object.values(currentAccounts);
            if (list.length === 0) {
                showToast("База пуста!");
                return;
            }

            list.sort((a, b) => (b._totalWins || 0) - (a._totalWins || 0));

            let lines = [
                `👑 <b>БАЗА ИГРОКОВ «УБЕЖИЩЕ»</b>\n`,
                `👥 Всего игроков: <b>${list.length}</b>\n`
            ];

            list.forEach((acc, idx) => {
                let w = acc._totalWins || 0;
                let mark = idx === 0 ? "🥇" : (idx === 1 ? "🥈" : (idx === 2 ? "🥉" : "🔹"));
                lines.push(
                    `${mark} <b>${acc.name}</b>\n` +
                    `   🔑 Пароль: <code>${acc.password || '—'}</code>\n` +
                    `   🏆 Побед над боссом: <b>${w}</b>\n`
                );
            });

            lines.push(`⏰ <i>Обновлено: ${new Date().toLocaleTimeString()}</i>`);

            try {
                let res = await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TG_ADMIN_CHAT_ID,
                        text: lines.join('\n'),
                        parse_mode: 'HTML'
                    })
                });
                let json = await res.json();
                if (json.ok) {
                    showToast("✅ Отправлено в Telegram!");
                } else {
                    showToast("Ошибка отправки: " + json.description);
                }
            } catch(e) {
                showToast("Ошибка сети: " + e.message);
            }
        }

        // Первичная загрузка
        loadFirebaseData();
    </script>
</body>
</html>
